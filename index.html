<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PT Trainer · Nexus Labs AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="hdr">
  <div class="brand">
    <div class="brand-bar"></div>
    <div style="flex-grow:1">
      <div class="brand-title">PT_TRAINER</div>
      <div class="brand-sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Portugués... · Nexus Labs</div>
    </div>
  </div>
  <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom: 0.6rem;">
    <input type="text" id="search-input" placeholder="Buscar verbo, frase..." oninput="handleSearch(this.value)" style="padding:0.4rem 0.6rem; border-radius:4px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:0.75rem; width:130px;">
    <button onclick="toggleTheme()" id="theme-btn" style="background:transparent; border:1px solid var(--border); color:var(--text); padding:0.35rem 0.5rem; border-radius:4px; font-size:0.9rem; cursor:pointer;" title="Cambiar tema">🌗</button>
  </div>
  <div id="nav"></div>
</div>

<div id="main"><div id="content"></div></div>

<div id="ftr">
  PT_TRAINER · Nexus Labs AI · 30 verbos · 10 tempos verbais · A1–C2<br>
  <span style="color:var(--border)">* «vós» es arcaico en el Brasil moderno — en el habla real se usa «vocês»</span>
</div>

<script src="script.js"></script>
</body>
</html>
